name: Kubemanager CI/CD

on:
  push:
    branches: [ "main", "preprod" ]
  pull_request:
    branches: [ "main", "preprod" ]

jobs:
  quality-check:
    name: Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true

      - name: Install tools
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run Unit Tests
        run: go test ./internal/... ./cmd/...

      - name: Vulnerability Check
        run: govulncheck ./...

  build-and-push:
    name: Docker Build & Push
    needs: quality-check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preprod')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Uniquement des tags :sha : ce qui tourne est toujours identifiable.
      - name: Build and push API/worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: thekrauss/kubemanager:${{ github.sha }}

      - name: Build and push static-edge
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/static-edge.Dockerfile
          push: true
          tags: thekrauss/static-edge:${{ github.sha }}

  # Inactif tant que la variable de dépôt DEPLOY_ENABLED ne vaut pas "true"
  # (voir deploy/README.txt). L'image de la console se construit à part.
  deploy:
    name: Deploy to server 1
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the image of this commit
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd /opt/betorun/kubemanager
            git fetch --quiet origin
            git checkout --quiet ${{ github.sha }}
            cat > /opt/betorun/secrets/images.env <<IMAGES
            KUBEMANAGER_IMAGE=thekrauss/kubemanager:${{ github.sha }}
            STATIC_EDGE_IMAGE=thekrauss/static-edge:${{ github.sha }}
            IMAGES
            sed -i 's/^ *//' /opt/betorun/secrets/images.env
            deploy/compose.sh pull api worker static-edge
            deploy/compose.sh up -d --no-deps api
            deploy/compose.sh up -d --no-deps worker static-edge
            docker image prune -f
            echo "Deployed ${{ github.sha }}"
