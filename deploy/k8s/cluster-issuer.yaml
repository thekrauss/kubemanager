# Émetteur Let's Encrypt des conteneurs : nom attendu par le chart
# (letsencrypt-prod). Remplacer l'adresse avant d'appliquer :
#   sed 's/ops@REMPLACER.invalid/ops@votre-domaine/' deploy/k8s/cluster-issuer.yaml | kubectl apply -f -
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@REMPLACER.invalid
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
