# Example: ExternalSecret (external-secrets.io v1beta1)
# Requires:
#   - external-secrets operator installed in cluster
#   - A SecretStore / ClusterSecretStore named "kubemanager-store" backed by
#     Vault, AWS Secrets Manager, GCP Secret Manager, etc.
#
# This manifest creates the `kubemanager-secrets` K8s Secret consumed by the
# chart (via .Values.existingSecret), populated from an external KV backend.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kubemanager-secrets
  namespace: kubemanager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubemanager-store
    kind: ClusterSecretStore
  target:
    name: kubemanager-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef: { key: prod/kubemanager/db, property: password }
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: prod/kubemanager/redis, property: password }
    - secretKey: JWT_SECRET
      remoteRef: { key: prod/kubemanager/jwt, property: access }
    - secretKey: JWT_REFRESH_SECRET
      remoteRef: { key: prod/kubemanager/jwt, property: refresh }
    - secretKey: KEYCLOAK_ADMIN_CLIENT_SECRET
      remoteRef: { key: prod/kubemanager/keycloak, property: admin_client_secret }
    - secretKey: CENTRIFUGO_API_KEY
      remoteRef: { key: prod/kubemanager/centrifugo, property: api_key }
    - secretKey: CENTRIFUGO_TOKEN_HMAC_SECRET
      remoteRef: { key: prod/kubemanager/centrifugo, property: hmac }
---
# Example Vault-backed ClusterSecretStore (adapt to your provider).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: kubemanager-store
spec:
  provider:
    vault:
      server: "https://vault.internal.example:8200"
      path: "kv"
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: kubemanager
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
