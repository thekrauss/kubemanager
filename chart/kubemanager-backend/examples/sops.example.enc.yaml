# Example: SOPS-encrypted secret (checked in to git safely).
# Decrypt + apply workflow:
#
#   sops --age AGE_RECIPIENT -e secret-plain.yaml > sops.example.enc.yaml
#   sops -d sops.example.enc.yaml | kubectl apply -n kubemanager -f -
#
# .sops.yaml at repo root defines creation rules (targeted ages / KMS keys).
# This file below is illustrative only — the `sops_secret` block shape is
# generated by `sops -e`.
apiVersion: v1
kind: Secret
metadata:
  name: kubemanager-secrets
  namespace: kubemanager
type: Opaque
stringData:
  DB_PASSWORD: ENC[AES256_GCM,data:...,iv:...,tag:...,type:str]
  # ... autres clés ENC[...]
sops:
  kms: []
  age:
    - recipient: age1examplexxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      enc: |
        -----BEGIN AGE ENCRYPTED FILE-----
        ...
        -----END AGE ENCRYPTED FILE-----
  lastmodified: "2026-04-17T12:00:00Z"
  version: 3.8.1
