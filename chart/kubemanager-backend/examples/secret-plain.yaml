# Example: plain K8s Secret for dev / staging.
# NEVER commit populated secrets to git. Use envsubst, sealed-secrets,
# or externalsecrets for prod — see docs/interne/secrets-management.md.
#
#   export KUBEMANAGER_DB_PASSWORD=...
#   export KUBEMANAGER_JWT_SECRET=$(openssl rand -hex 32)
#   export KUBEMANAGER_JWT_REFRESH_SECRET=$(openssl rand -hex 32)
#   export KUBEMANAGER_KEYCLOAK_CLIENT_SECRET=...
#   export KUBEMANAGER_CENTRIFUGO_API_KEY=$(openssl rand -hex 16)
#   export KUBEMANAGER_CENTRIFUGO_HMAC=$(openssl rand -hex 32)
#   envsubst < secret-plain.yaml | kubectl apply -n kubemanager -f -
apiVersion: v1
kind: Secret
metadata:
  name: kubemanager-secrets
  namespace: kubemanager
type: Opaque
stringData:
  DB_PASSWORD: "${KUBEMANAGER_DB_PASSWORD}"
  REDIS_PASSWORD: "${KUBEMANAGER_REDIS_PASSWORD:-}"
  JWT_SECRET: "${KUBEMANAGER_JWT_SECRET}"
  JWT_REFRESH_SECRET: "${KUBEMANAGER_JWT_REFRESH_SECRET}"
  KEYCLOAK_ADMIN_CLIENT_SECRET: "${KUBEMANAGER_KEYCLOAK_CLIENT_SECRET}"
  CENTRIFUGO_API_KEY: "${KUBEMANAGER_CENTRIFUGO_API_KEY}"
  CENTRIFUGO_TOKEN_HMAC_SECRET: "${KUBEMANAGER_CENTRIFUGO_HMAC}"
