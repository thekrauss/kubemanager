{{- if .Values.prometheusRule.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kubemanager.fullname" . }}
  {{- with .Values.prometheusRule.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "kubemanager.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    # ── RED golden signals ─────────────────────────────────────────────────
    - name: kubemanager.http.red
      interval: 30s
      rules:
        - alert: KubeManagerHighErrorRate
          expr: |
            (
              sum(rate(gin_requests_total{code=~"5.."}[5m]))
              /
              sum(rate(gin_requests_total[5m]))
            ) > 0.01
          for: 5m
          labels:
            severity: critical
            service: kubemanager
          annotations:
            summary: "KubeManager 5xx error rate > 1%"
            description: "The API is returning {{`{{ $value | humanizePercentage }}`}} of 5xx responses over 5 min."
            runbook_url: "https://docs.internal/runbook#api-totalement-down"

        - alert: KubeManagerHighLatencyP95
          expr: |
            histogram_quantile(
              0.95,
              sum(rate(gin_request_duration_seconds_bucket[5m])) by (le)
            ) > 1
          for: 10m
          labels:
            severity: warning
            service: kubemanager
          annotations:
            summary: "KubeManager P95 latency > 1s"
            description: "P95 is {{`{{ $value | humanizeDuration }}`}} over the last 10 min."

        - alert: KubeManagerRateLimitStorm
          expr: |
            sum(rate(gin_requests_total{code="429"}[5m])) > 5
          for: 5m
          labels:
            severity: warning
            service: kubemanager
          annotations:
            summary: "Sustained 429 rate-limit responses"
            description: "{{`{{ $value | humanize }}`}} req/s hitting rate limit — investigate tenant/IP."

    # ── Temporal workflow health ────────────────────────────────────────────
    - name: kubemanager.temporal
      interval: 30s
      rules:
        - alert: TemporalWorkflowFailureRate
          expr: |
            (
              sum(rate(temporal_workflow_failed_total[5m]))
              /
              sum(rate(temporal_workflow_completed_total[5m]))
            ) > 0.05
          for: 10m
          labels:
            severity: critical
            service: kubemanager
          annotations:
            summary: "Temporal workflow failure rate > 5%"
            description: "{{`{{ $value | humanizePercentage }}`}} of workflows are failing. Check worker logs + Temporal UI."

        - alert: TemporalTaskQueueLag
          expr: |
            max(temporal_workflow_task_schedule_to_start_latency_seconds) > 60
          for: 10m
          labels:
            severity: warning
            service: kubemanager
          annotations:
            summary: "Temporal task queue backing up"
            description: "Workflow tasks waiting {{`{{ $value | humanizeDuration }}`}} before a worker picks them up. Scale the worker Deployment."

    # ── Business — workloads / clusters ─────────────────────────────────────
    - name: kubemanager.business
      interval: 30s
      rules:
        - alert: WorkloadSagaDeleteFailures
          expr: |
            sum(rate(kubemanager_workload_status_transitions_total{status="DELETE_FAILED"}[10m])) > 0
          for: 5m
          labels:
            severity: warning
            service: kubemanager
          annotations:
            summary: "Workload delete sagas entering DELETE_FAILED"
            description: "Helm uninstall or DB cleanup failing — check processor.go logs."

        - alert: ClusterWatcherStale
          expr: |
            time() - kubemanager_cluster_last_seen_timestamp_seconds > 300
          for: 5m
          labels:
            severity: critical
            service: kubemanager
          annotations:
            summary: "Cluster watcher silent > 5 min"
            description: "Cluster {{`{{ $labels.cluster_id }}`}} hasn't reported pod events for {{`{{ $value | humanizeDuration }}`}}. Watcher likely down."
            runbook_url: "https://docs.internal/runbook#watcher-offline-staleness-alert"

    # ── Infra runtime Go ────────────────────────────────────────────────────
    - name: kubemanager.runtime
      interval: 1m
      rules:
        - alert: KubeManagerHighGoroutines
          expr: go_goroutines{job=~".*kubemanager.*"} > 10000
          for: 15m
          labels:
            severity: warning
            service: kubemanager
          annotations:
            summary: "Goroutine count > 10k"
            description: "{{`{{ $value }}`}} goroutines — suspect leak (logs stream? workflow loops?)."

        - alert: KubeManagerHeapPressure
          expr: |
            (go_memstats_heap_inuse_bytes{job=~".*kubemanager.*"}
             / go_memstats_heap_sys_bytes{job=~".*kubemanager.*"}) > 0.9
          for: 15m
          labels:
            severity: warning
            service: kubemanager
          annotations:
            summary: "Heap utilization > 90%"
            description: "Heap in-use {{`{{ $value | humanizePercentage }}`}} of sys — imminent OOM risk."
{{- end }}
