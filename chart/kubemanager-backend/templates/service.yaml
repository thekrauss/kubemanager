apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubemanager.fullname" . }}-server
  labels:
    {{- include "kubemanager.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.server.service.type }}
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kubemanager.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
